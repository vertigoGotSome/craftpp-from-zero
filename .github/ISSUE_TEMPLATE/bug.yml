name: Bug report
description: Report reproducible unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
